[project]
name = "plumarc-shared"
version = "0.1.0"
description = "Code used by both the auth and backend services"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.9",
]

[project.optional-dependencies]
testing = ["pgserver>=0.1.4"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
