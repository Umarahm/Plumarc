[project]
name = "plumarc-auth"
version = "0.1.0"
description = "Verifies Auth0 tokens and answers who a user is and what they may do"
requires-python = ">=3.12,<3.13"
dependencies = [
    "casbin>=1.36",
    "fastapi>=0.115",
    "plumarc-shared",
    "pydantic-settings>=2.5",
    "pyjwt[crypto]>=2.10",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "plumarc-shared[testing]", "pytest>=8", "ruff>=0.8"]

[tool.uv.sources]
plumarc-shared = { path = "../shared", editable = true }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
# B008: FastAPI's Depends() in defaults. S101: pytest assertions.
ignore = ["B008"]
per-file-ignores = { "tests/*" = ["S101", "S105", "S106", "S608"] }
